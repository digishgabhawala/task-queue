[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "B008",   # FastAPI's Depends(...)-as-default-arg is the documented DI pattern, not a bug
    "BLE001", # worker loops need a top-level catch-all to report ANY failure via
              # fail_task() and keep polling, rather than crashing the whole
              # process on an exception type nobody anticipated
]
